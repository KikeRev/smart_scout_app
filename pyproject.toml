[project]
name = "agent-smart-scouting-ai"
version = "1.0.0"
description = "Conversational AI scouting platform – FastAPI backend, Django UI, embeddings & RAG"
authors = [
  { name = "Enrique Revuelta", email = "enrique.revuelta@bain.com" }
]
requires-python = ">=3.11"

dependencies = [
  # --- Web & API layer ---
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "django==5.2.6",
  "django-bootstrap5==25.2",
  "django-widget-tweaks==1.5.0",
  "dj-database-url==3.0.1",
  "python-decouple==3.8",
  "django-allauth==65.11.2",
  "django-markdownify==0.9.5",

  # --- GenAI & RAG ---
  "langchain==0.3.27",
  "langgraph==0.6.7",
  "sentence-transformers==5.1.0",
  "llama-cpp-python==0.3.16",
  "faiss-cpu==1.12.0",
  "transformers==4.56.1",
  "torch==2.8.0",
  "sentencepiece==0.2.1",
  "langchain-community==0.3.29",
  "openai==1.107.1",
  "langchain-openai==0.3.33",

  # --- Data processing & ML ---
  "pandas==2.3.2",
  "numpy==2.3.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "rapidfuzz==3.14.1",
  "matplotlib==3.10.6",
  "plotly==6.3.0",
  "mplsoccer==1.5.1",
  "highlight-text==0.2",
  "unidecode==1.4.0",

  # --- ETL / scraping ---
  "feedparser==6.0.12",
  "newspaper3k==0.2.8",
  "lxml_html_clean==0.4.2",
  "tabulate==0.9.0",
  "requests==2.32.5",

  # --- Vector & storage ---
  "psycopg2-binary==2.9.10",
  "pgvector==0.4.1",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",

  # --- Task queue & workers ---
  "celery==5.5.3",
  "python-dotenv==1.1.1",

  # --- Reporting ---
  "fpdf2==2.8.4",
  "kaleido==1.1.0",
  "markdown==3.9",
  "cairosvg==2.8.2",
  "weasyprint==66.0",

  # --- Dev & notebooks (optional, installed in dev profile) ---
  "jupyterlab==4.4.7",
  "ipykernel==6.30.1",
  
  # --- Testing ---
  "pytest==8.3.4",
  "pytest-django==4.9.0",
  "pytest-cov==6.0.0",
  "pytest-mock==3.14.0",
  "pytest-asyncio==0.24.0",
  "factory-boy==3.3.1",
  "faker==33.1.0",
  "httpx==0.28.1",
  "coverage==7.6.9"
]

[tool.pip]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.uv]
# Additional uv configuration can go here if needed

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--tb=short",
    "-v"
]
testpaths = ["tests", "apps"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow running tests",
    "validation: Data validation tests"
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/settings/*",
    "*/manage.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]