{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container my-4">
  <h2 class="mb-4">Edit Profile</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-submit mb-3"
            role="button" aria-label="Save profile changes">Save</button>
    <a href="{% url 'users:profile' %}" class="btn btn-link"
       role="button" aria-label="Cancel editing and return to profile">Cancel</a>
  </form>
</div>
{% endblock %}
