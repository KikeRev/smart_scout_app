{% load static %}
<!-- Application logo -->
<section class="text-center py-3">
    <img src="{% static 'img/app_logo_6.png' %}"    
         alt="Smart Scout logo"
         class="img-fluid app-logo">
</section>

<div class="row g-4">

    <!-- comparison table -->
    <div class="col-12 col-lg-6 order-lg-1 order-2">
        {{ table_html|safe }}
    </div>

    <!-- radars + pizza -->
    <div class="col-12 col-lg-6 order-lg-2 order-1">
        <div class="row gy-4">

            <!-- radars -->
            <div class="col-12 d-flex justify-content-between flex-wrap chart-wrapper">
                <img src="{{ radar_base }}" alt="Base radar" class="flex-grow-1 p-2">
                <img src="{{ radar_cand }}" alt="Candidate radar" class="flex-grow-1 p-2">
            </div>

            <!-- pizza comparison -->
            <div class="col-12 chart-wrapper text-center">
                <img src="{{ pizza_cmp }}" alt="Pizza comparison" class="p-2">
            </div>

        </div>
    </div>

</div>
