## docker-compose.yml
# This file is part of the Smart Scout App project.
# It defines the services, networks, and volumes used in the Docker setup.

x-networks: &default_networks
  networks:
    - scouting-net

services:
      
  # ==================== CORE ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scouting-api
    env_file:
      - .env
    command: >-
      uvicorn apps.agent_service.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./:/app 
      - ./media:/app/media
      - ./media_data:/app/media_data 
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    <<: *default_networks


  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scouting-ingestion
    env_file:
      - .env
    # ① = full bootstrap (players + embeddings + news)  
    # ② = news‑only mode (no touch on players)
    command: >
      sh -lc '
        set -eu
        echo "INGEST_MODE=$${INGEST_MODE:-<unset>}"
        if [ "$${INGEST_MODE:-}" = "news" ]; then
          echo "▶ News-only ingestion"
          python -m apps.ingestion.seed_and_ingest --ingest-news --skip-players --verbose
        else
          echo "▶ Full bootstrap (players + news)"
          python -m apps.ingestion.seed_and_ingest \
            --players-csv data/all_players_cleaned.csv \
            --replace --refresh-embs --ingest-news --verbose
        fi
      '
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./media_data:/app/media_data
    stdin_open: true 
    tty: true
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      TQDM_DISABLE: "0"
      TERM: xterm-256color
    depends_on:
      - db
    <<: *default_networks

  # =============== INFRA ========================
  db:
    image: ankane/pgvector:latest
    #container_name: db
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scouting
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    <<: *default_networks

  redis:
    image: redis:7-alpine
    #container_name: redis
    ports:
      - "6379:6379"
    <<: *default_networks

  # =============== DEV PROFILE ==================
  jupyter:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scouting-jupyter
    env_file:
      - .env
    command: >-
      jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser --NotebookApp.token=""
    volumes:
      - ./:/app
      - ./notebooks:/notebooks
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    ports:
      - "8888:8888"
    depends_on:
      - db
      - redis
    <<: *default_networks
  web:
    build: .
    container_name: scouting-web
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: http://localhost:8000
    command: >
        sh -c "python manage.py migrate &&
         python manage.py createsuperuser --no-input ||
         echo 'Superuser already exists' &&
         python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./media_data:/app/media_data
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    profiles: ["dev"]
    <<: *default_networks

networks:
  scouting-net:
    driver: bridge

volumes:
  pgdata:
  media: 
  media_data:

